[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "oshepherd"
version = "v0.0.24"
description = "The Oshepherd guiding the Ollama(s) inference orchestration."
readme = "README.md"
authors = [
    {name = "mnemonica.ai", email = "info@mnemonica.ai"},
]
requires-python = ">=3.12"
dependencies = [
    "uvicorn",
    "fastapi[standard]",
    "celery",
    "click",
    "ollama>=0.6.3",
    "amqp",
    "redis",
    "pydantic",
    "python-dotenv",
    "requests",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
supabase = [
    "httpx==0.28.1",
    "ollama==0.6.3"
]
dev = [
    "pytest",
    "httpx",
    "jsonschema==4.23.0",
    "black",
    "build",
    "twine"
]
tests = [
  "pytest",
  "httpx",
  "jsonschema==4.23.0"
]
lint = [
  "black"
]

[project.urls]
Homepage = "https://github.com/mnemonica-ai/oshepherd"
Issues = "https://github.com/mnemonica-ai/oshepherd/issues"

[project.scripts]
oshepherd = "oshepherd.cli:main"

[tool.setuptools.packages.find]
include = ["oshepherd", "oshepherd.*"]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "jsonschema==4.23.0",
    "black",
    "build",
    "twine",
]
