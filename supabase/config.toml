# Dedicated development stack; ports and project ID do not target existing apps.
project_id = "oshepherd-development"

[api]
enabled = true
port = 55321
# Add oshepherd_api after its reviewed schema is installed. PostgREST requires
# every exposed schema to exist even before any RPC is called.
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55322
shadow_port = 55320
major_version = 15

[db.seed]
enabled = false

[studio]
enabled = false

[local_smtp]
enabled = false

[storage]
enabled = true
file_size_limit = "32MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:55321"
additional_redirect_urls = []
jwt_expiry = 3600
enable_signup = false
enable_anonymous_sign_ins = false
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true
otp_expiry = 600
otp_length = 8

[analytics]
enabled = false

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 55383

[functions.ollama]
enabled = true
verify_jwt = false
entrypoint = "./functions/ollama/index.ts"
